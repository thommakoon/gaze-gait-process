# =============================================================================
# Paths to data roots. Override per-machine or per-experiment.
# Relative paths are resolved relative to the AndroidStudio repo root.
# =============================================================================

# Where session recordings live (Neon export + LF/RF/Head CSVs).
# Today still points at the legacy Test/ layout; switch to analysis/data/raw/
# once existing recordings are migrated.
data_raw_root: "Test/data"

# Per-session derived artifacts (manifests, sync reports, parquet outputs).
derived_root: "analysis/derived"

# Where generated figures live.
figures_root: "analysis/figures"

# Root of the lin2025 fork's data layout. The bridge writes inputs and reads
# outputs from this directory tree using lin2025's expected
# raw/ -> interim/ -> processed/ convention.
lin2025_data_root: "../lin2025_IMU-gait_analysis/StrokeGait"

# Subject and visit identifiers used when writing into lin2025's raw/<subj>/<visit>/imu/.
# Override per session if needed.
lin2025_subject: "imu_thom_urp2026"
lin2025_visit:   "visit1"
