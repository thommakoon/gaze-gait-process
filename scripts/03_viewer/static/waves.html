<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wave viewer — gazeGait</title>
  <style>
    :root {
      --bg: #1e1e1e;
      --panel: #252526;
      --lane-a: #2d2d30;
      --lane-b: #333337;
      --border: #3f3f46;
      --grid: #454545;
      --text: #d4d4d4;
      --muted: #9a9a9a;
      --accent: #4ec9b0;
      --cursor: #f44747;
      --ruler: #569cd6;
      --tools-w: 240px;
      --names-w: 180px;
      --lane-h: 28px;
      --bottom-h: 88px;
      --header-h: 44px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: Consolas, "Cascadia Mono", "Segoe UI", monospace;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }
    .app {
      display: grid;
      grid-template-rows: var(--header-h) 1fr var(--bottom-h);
      height: 100vh;
    }
    header {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0 0.75rem;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      font-size: 0.85rem;
    }
    header h1 { margin: 0; font-size: 0.95rem; font-weight: 600; }
    header .meta { color: var(--muted); }
    a.btn {
      color: var(--text);
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 0.25rem 0.55rem;
      background: #2a2a2a;
      font-size: 0.8rem;
    }
    a.btn:hover { background: #353535; }
    .main {
      display: grid;
      grid-template-columns: var(--names-w) 1fr var(--tools-w);
      min-height: 0;
      overflow: hidden;
    }
    .names {
      background: var(--panel);
      border-right: 1px solid var(--border);
      overflow: hidden;
    }
    .names .head {
      height: 26px;
      border-bottom: 1px solid var(--border);
      padding: 0.35rem 0.5rem;
      font-size: 0.72rem;
      color: var(--muted);
      background: #2a2a2a;
    }
    .name-row {
      height: var(--lane-h);
      line-height: var(--lane-h);
      padding: 0 0.5rem;
      font-size: 0.75rem;
      border-bottom: 1px solid #2f2f2f;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--muted);
    }
    .name-row:nth-child(odd) { background: var(--lane-a); }
    .name-row:nth-child(even) { background: var(--lane-b); }
    .name-row.active { color: var(--accent); }
    .names-scroll { overflow-y: auto; height: calc(100% - 26px); }
    .wave-area {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }
    .ruler-wrap {
      height: 26px;
      background: #2a2a2a;
      border-bottom: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }
    #ruler-canvas { display: block; width: 100%; height: 26px; }
    .canvas-wrap {
      flex: 1;
      position: relative;
      overflow: auto;
      min-height: 0;
    }
    #wave-canvas { display: block; width: 100%; height: 100%; }
    .cursor-line {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      background: var(--cursor);
      pointer-events: none;
      z-index: 2;
      display: none;
    }
    .tools {
      background: var(--panel);
      border-left: 1px solid var(--border);
      padding: 0.5rem;
      overflow-y: auto;
      font-size: 0.78rem;
    }
    .tools h2 {
      margin: 0 0 0.5rem;
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .tools section { margin-bottom: 1rem; }
    .tools button {
      display: block;
      width: 100%;
      margin-bottom: 0.35rem;
      padding: 0.35rem 0.5rem;
      font: inherit;
      font-size: 0.78rem;
      background: #2a2a2a;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 3px;
      cursor: pointer;
      text-align: left;
    }
    .tools button:hover { background: #353535; }
    .tools button.active { border-color: var(--accent); color: var(--accent); }
    .tools .readout {
      margin-top: 0.35rem;
      padding: 0.35rem;
      background: #1a1a1a;
      border: 1px solid var(--border);
      border-radius: 3px;
      font-size: 0.72rem;
      line-height: 1.5;
      color: var(--muted);
    }
    .tools .readout strong { color: var(--text); }
    .legend .swatch {
      display: inline-block;
      width: 1.1rem;
      height: 0;
      border-top: 2px solid var(--swatch-color);
      margin-right: 0.25rem;
      vertical-align: middle;
    }
    .legend .swatch.dashed { border-top-style: dashed; }
    .y-scale-row {
      margin-bottom: 0.55rem;
      padding-bottom: 0.55rem;
      border-bottom: 1px solid #333;
    }
    .y-scale-row:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .y-scale-label {
      font-size: 0.72rem;
      color: var(--text);
      margin-bottom: 0.25rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .y-scale-auto {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.7rem;
      color: var(--muted);
      margin-bottom: 0.25rem;
    }
    .y-scale-auto input { accent-color: var(--accent); }
    .y-scale-inputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.25rem;
    }
    .y-scale-inputs input {
      width: 100%;
      padding: 0.2rem 0.3rem;
      font: inherit;
      font-size: 0.7rem;
      background: #1a1a1a;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 3px;
    }
    .y-scale-inputs input:disabled { opacity: 0.45; }
    .y-scale-fit {
      margin-top: 0.2rem;
      padding: 0;
      border: none;
      background: none;
      color: var(--accent);
      font: inherit;
      font-size: 0.68rem;
      cursor: pointer;
      text-align: left;
    }
    .y-scale-fit:hover { text-decoration: underline; }
    .bottom {
      background: var(--panel);
      border-top: 1px solid var(--border);
      padding: 0.45rem 0.75rem 0.55rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .scroll-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.72rem;
      color: var(--muted);
    }
    .scroll-row input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
    }
    .minimap {
      position: relative;
      height: 18px;
      background: #1a1a1a;
      border: 1px solid var(--border);
      border-radius: 2px;
    }
    .minimap-viewport {
      position: absolute;
      top: 1px;
      bottom: 1px;
      background: rgba(78, 201, 176, 0.25);
      border: 1px solid var(--accent);
      border-radius: 1px;
      min-width: 4px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <a class="btn" id="back-link" href="/">← Session</a>
      <h1>Wave viewer</h1>
      <span class="meta" id="header-meta">Loading…</span>
    </header>

    <div class="main">
      <div class="names" id="names-panel">
        <div class="head">Name</div>
        <div class="names-scroll" id="name-rows"></div>
      </div>

      <div class="wave-area">
        <div class="ruler-wrap">
          <canvas id="ruler-canvas"></canvas>
        </div>
        <div class="canvas-wrap" id="canvas-wrap">
          <canvas id="wave-canvas"></canvas>
          <div class="cursor-line" id="cursor-line"></div>
        </div>
      </div>

      <aside class="tools">
        <section>
          <h2>View</h2>
          <button type="button" id="btn-zoom-in">Zoom in</button>
          <button type="button" id="btn-zoom-out">Zoom out</button>
          <button type="button" id="btn-fit">Fit full timeline</button>
        </section>
        <section>
          <h2>Cursor</h2>
          <button type="button" id="btn-cursor" class="active">Time cursor</button>
          <div class="readout" id="cursor-readout">
            <div><strong>Cursor</strong> —</div>
            <div><strong>Window</strong> —</div>
          </div>
        </section>
        <section>
          <h2>Y scale</h2>
          <button type="button" id="btn-y-auto-all">Auto all</button>
          <div id="y-scale-rows"></div>
        </section>
        <section>
          <h2>Signals</h2>
          <div class="readout" id="signal-readout">Loading…</div>
        </section>
        <section>
          <h2>Gait events</h2>
          <div class="readout legend" id="marker-legend">—</div>
        </section>
      </aside>
    </div>

    <div class="bottom">
      <div class="scroll-row">
        <span id="scroll-label-start">0 s</span>
        <input type="range" id="time-scroll" min="0" max="1000" value="0" step="1">
        <span id="scroll-label-end">—</span>
      </div>
      <div class="minimap" id="minimap">
        <div class="minimap-viewport" id="minimap-viewport"></div>
      </div>
      <div class="status-row">
        <span id="status-left">t_start —</span>
        <span id="status-right">Sample rate —</span>
      </div>
    </div>
  </div>

  <script>
    const LANE_H = 28;
    const EMPTY_LANES = 2;
    const SIGNAL_COLORS = {
      lf_position_z: "#4ec9b0",
      rf_position_z: "#6a9fb5",
      head_roll: "#c586c0",
      head_pitch: "#dcdcaa",
      head_yaw: "#9cdcfe",
      head_roll_rate: "#a86fa3",
      head_pitch_rate: "#b8b87a",
      head_yaw_rate: "#7eb8d8",
      gaze_x: "#ce9178",
      gaze_y: "#d7ba7d",
      gaze_azimuth: "#f48771",
      gaze_elevation: "#cca700",
      gaze_azimuth_rate: "#d96a55",
      gaze_elevation_rate: "#b89200",
    };
    const MARKER_STYLES = {
      lf_IC: { color: "#4ec9b0", dash: [] },
      lf_TO: { color: "#4ec9b0", dash: [4, 3] },
      rf_IC: { color: "#6a9fb5", dash: [] },
      rf_TO: { color: "#6a9fb5", dash: [4, 3] },
    };

    const sessionId = (() => {
      const parts = window.location.pathname.split("/").filter(Boolean);
      return parts[0] === "session" ? parts[1] : null;
    })();

    const state = {
      tStartNs: 0,
      tEndNs: 0,
      durationS: 0,
      fsHz: 200,
      nGrid: 0,
      viewStartS: 0,
      viewDurationS: 30,
      cursorS: null,
      cursorMode: true,
      signals: [],
      markers: [],
      signalLoadError: null,
      waveMissing: [],
      yScale: {},
    };

    const $ = (id) => document.getElementById(id);
    const waveCanvas = $("wave-canvas");
    const rulerCanvas = $("ruler-canvas");
    const waveCtx = waveCanvas.getContext("2d");
    const rulerCtx = rulerCanvas.getContext("2d");

    function fmtTimeS(s) {
      if (s == null || !Number.isFinite(s)) return "—";
      if (s >= 60) {
        const m = Math.floor(s / 60);
        const r = s - m * 60;
        return `${m}:${r.toFixed(2).padStart(5, "0")}`;
      }
      return `${s.toFixed(3)} s`;
    }

    function fmtUtcNs(ns) {
      return `${ns}`;
    }

    function clampView() {
      const minDur = Math.min(1, state.durationS || 1);
      state.viewDurationS = Math.max(minDur, Math.min(state.durationS || minDur, state.viewDurationS));
      const maxStart = Math.max(0, state.durationS - state.viewDurationS);
      state.viewStartS = Math.max(0, Math.min(maxStart, state.viewStartS));
      if (state.cursorS != null) {
        state.cursorS = Math.max(state.viewStartS, Math.min(state.viewStartS + state.viewDurationS, state.cursorS));
      }
    }

    function resizeCanvases() {
      const wrap = $("canvas-wrap");
      const dpr = window.devicePixelRatio || 1;
      const w = wrap.clientWidth;
      const h = Math.max(wrap.clientHeight, laneCount() * LANE_H);
      waveCanvas.width = Math.max(1, Math.floor(w * dpr));
      waveCanvas.height = Math.max(1, Math.floor(h * dpr));
      waveCanvas.style.width = `${w}px`;
      waveCanvas.style.height = `${h}px`;
      waveCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const rw = wrap.clientWidth;
      rulerCanvas.width = Math.max(1, Math.floor(rw * dpr));
      rulerCanvas.height = Math.floor(26 * dpr);
      rulerCanvas.style.width = `${rw}px`;
      rulerCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

      drawAll();
    }

    function timeToX(tS, width) {
      const rel = (tS - state.viewStartS) / state.viewDurationS;
      return rel * width;
    }

    function xToTime(x, width) {
      return state.viewStartS + (x / width) * state.viewDurationS;
    }

    function pickGridStep() {
      const targetPx = 80;
      const w = waveCanvas.clientWidth || 800;
      const secPerPx = state.viewDurationS / w;
      const raw = secPerPx * targetPx;
      const steps = [0.1, 0.2, 0.5, 1, 2, 5, 10, 20, 30, 60];
      return steps.find((s) => s >= raw) || 60;
    }

    function drawGaitMarkers(ctx, w, height, { top = 0 } = {}) {
      if (!state.markers.length) return;
      const winEnd = state.viewStartS + state.viewDurationS;
      for (const marker of state.markers) {
        const t = marker.time_s;
        if (t < state.viewStartS - 1e-6 || t > winEnd + 1e-6) continue;
        const style = MARKER_STYLES[`${marker.foot}_${marker.event}`];
        if (!style) continue;
        const x = timeToX(t, w) + 0.5;
        ctx.strokeStyle = style.color;
        ctx.lineWidth = 1;
        ctx.setLineDash(style.dash);
        ctx.beginPath();
        ctx.moveTo(x, top);
        ctx.lineTo(x, height);
        ctx.stroke();
      }
      ctx.setLineDash([]);
    }

    function drawRuler() {
      const w = rulerCanvas.clientWidth;
      const h = 26;
      rulerCtx.fillStyle = "#2a2a2a";
      rulerCtx.fillRect(0, 0, w, h);
      const step = pickGridStep();
      const t0 = Math.ceil(state.viewStartS / step) * step;
      rulerCtx.fillStyle = "#9a9a9a";
      rulerCtx.font = "11px Consolas, monospace";
      rulerCtx.strokeStyle = "#569cd6";
      rulerCtx.lineWidth = 1;
      for (let t = t0; t <= state.viewStartS + state.viewDurationS + 1e-9; t += step) {
        const x = Math.round(timeToX(t, w)) + 0.5;
        rulerCtx.beginPath();
        rulerCtx.moveTo(x, 18);
        rulerCtx.lineTo(x, h);
        rulerCtx.stroke();
        rulerCtx.fillText(fmtTimeS(t), x + 3, 12);
      }
      drawGaitMarkers(rulerCtx, w, h);
    }

    function laneCount() {
      return Math.max(state.signals.length + EMPTY_LANES, EMPTY_LANES);
    }

    function valueRangeInWindow(times, values, t0, t1) {
      let vmin = Infinity;
      let vmax = -Infinity;
      for (let i = 0; i < times.length; i++) {
        const t = times[i];
        const tNext = i + 1 < times.length ? times[i + 1] : t1;
        if (tNext < t0 || t > t1) continue;
        if (values[i] == null || !Number.isFinite(values[i])) continue;
        vmin = Math.min(vmin, values[i]);
        vmax = Math.max(vmax, values[i]);
      }
      return padValueRange(vmin, vmax);
    }

    function valueRangeFullData(times, values) {
      let vmin = Infinity;
      let vmax = -Infinity;
      for (let i = 0; i < values.length; i++) {
        if (values[i] == null || !Number.isFinite(values[i])) continue;
        vmin = Math.min(vmin, values[i]);
        vmax = Math.max(vmax, values[i]);
      }
      return padValueRange(vmin, vmax);
    }

    function padValueRange(vmin, vmax) {
      if (!Number.isFinite(vmin)) return { vmin: 0, vmax: 1 };
      if (vmin === vmax) {
        const pad = Math.max(Math.abs(vmin) * 0.1, 0.01);
        return { vmin: vmin - pad, vmax: vmax + pad };
      }
      const pad = (vmax - vmin) * 0.08;
      return { vmin: vmin - pad, vmax: vmax + pad };
    }

    function ensureYScale(signalId) {
      if (!state.yScale[signalId]) {
        state.yScale[signalId] = { auto: true, ymin: "", ymax: "" };
      }
      return state.yScale[signalId];
    }

    function signalValueRange(signal) {
      const t0 = state.viewStartS;
      const t1 = state.viewStartS + state.viewDurationS;
      const ys = ensureYScale(signal.id);
      if (ys.auto) {
        return valueRangeInWindow(signal.times_s, signal.values, t0, t1);
      }
      let vmin = Number(ys.ymin);
      let vmax = Number(ys.ymax);
      if (!Number.isFinite(vmin) || !Number.isFinite(vmax)) {
        return valueRangeInWindow(signal.times_s, signal.values, t0, t1);
      }
      if (vmin > vmax) [vmin, vmax] = [vmax, vmin];
      return padValueRange(vmin, vmax);
    }

    function fmtScaleValue(value, unit) {
      if (!Number.isFinite(value)) return "";
      if (unit === "m") return (value * 100).toFixed(1);
      if (unit === "deg") return value.toFixed(1);
      if (unit === "deg/s") return value.toFixed(2);
      if (unit === "px") return value.toFixed(0);
      return String(value);
    }

    function parseScaleInput(raw, unit) {
      const n = Number(raw);
      if (!Number.isFinite(n)) return null;
      if (unit === "m") return n / 100;
      return n;
    }

    function scaleInputPlaceholder(value, unit) {
      if (!Number.isFinite(value)) return "—";
      return fmtScaleValue(value, unit);
    }

    function valueToLaneY(laneIdx, value, vmin, vmax) {
      const top = laneIdx * LANE_H + 3;
      const bottom = (laneIdx + 1) * LANE_H - 3;
      const frac = (value - vmin) / (vmax - vmin);
      return bottom - frac * (bottom - top);
    }

    function lowerBound(times, t) {
      let lo = 0;
      let hi = times.length;
      while (lo < hi) {
        const mid = (lo + hi) >> 1;
        if (times[mid] < t) lo = mid + 1;
        else hi = mid;
      }
      return lo;
    }

    function sliceWindow(times, values, t0, t1) {
      const i0 = Math.max(0, lowerBound(times, t0) - 1);
      const i1 = Math.min(times.length, lowerBound(times, t1) + 1);
      return { times: times.slice(i0, i1), values: values.slice(i0, i1) };
    }

    function decimate(times, values, maxPoints) {
      if (times.length <= maxPoints) return { times, values };
      const outT = [];
      const outV = [];
      const n = times.length;
      for (let j = 0; j < maxPoints; j++) {
        const i = Math.min(n - 1, Math.floor((j * (n - 1)) / (maxPoints - 1)));
        outT.push(times[i]);
        outV.push(values[i]);
      }
      return { times: outT, values: outV };
    }

    function drawSignalLane(ctx, laneIdx, signal, w) {
      const times = signal.times_s;
      const values = signal.values;
      if (!times?.length) return;

      const t0 = state.viewStartS;
      const t1 = state.viewStartS + state.viewDurationS;
      const { vmin, vmax } = signalValueRange(signal);
      const color = SIGNAL_COLORS[signal.id] || "#dcdcaa";
      const yBase = laneIdx * LANE_H;
      const isStrideSeries = Array.isArray(signal.stride_index);

      let plot = sliceWindow(times, values, t0, t1);
      if (!isStrideSeries) {
        plot = decimate(plot.times, plot.values, Math.max(64, w * 2));
      }

      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = isStrideSeries ? 1.5 : 1.25;

      ctx.beginPath();
      let started = false;
      for (let i = 0; i < plot.times.length; i++) {
        const v = plot.values[i];
        if (v == null || !Number.isFinite(v)) {
          started = false;
          continue;
        }
        const x = timeToX(plot.times[i], w);
        const y = valueToLaneY(laneIdx, v, vmin, vmax);
        if (!started) {
          ctx.moveTo(x, y);
          started = true;
        } else {
          ctx.lineTo(x, y);
        }
      }
      if (started) ctx.stroke();

      if (isStrideSeries) {
        for (let i = 0; i < times.length; i++) {
          const t = times[i];
          if (t < t0 - 0.5 || t > t1 + 0.5) continue;
          const x = timeToX(t, w);
          const y = valueToLaneY(laneIdx, values[i], vmin, vmax);
          const outlier = signal.is_outlier && signal.is_outlier[i];
          ctx.beginPath();
          ctx.fillStyle = outlier ? "#ce9178" : color;
          ctx.arc(x, y, outlier ? 2.5 : 2, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      ctx.fillStyle = "#6a9955";
      ctx.font = "10px Consolas, monospace";
      const scaleLabel = ensureYScale(signal.id).auto ? "" : " [fixed]";
      const rangeText = signal.unit === "m"
        ? `${fmtScaleValue(vmin, "m")}–${fmtScaleValue(vmax, "m")} cm${scaleLabel}`
        : `${vmin.toFixed(3)}–${vmax.toFixed(3)} ${signal.unit || ""}${scaleLabel}`;
      ctx.fillText(rangeText, 4, yBase + 11);
    }

    function interpolateAtTime(signal, tS) {
      const times = signal.times_s;
      const values = signal.values;
      if (!times?.length) return null;
      if (tS <= times[0]) {
        const v0 = values[0];
        return v0 == null || !Number.isFinite(v0) ? null : { value: v0, time: tS };
      }
      if (tS >= times[times.length - 1]) {
        const vn = values[values.length - 1];
        return vn == null || !Number.isFinite(vn) ? null : { value: vn, time: tS };
      }
      let lo = 0;
      let hi = times.length - 1;
      while (lo + 1 < hi) {
        const mid = (lo + hi) >> 1;
        if (times[mid] <= tS) lo = mid;
        else hi = mid;
      }
      const vLo = values[lo];
      const vHi = values[hi];
      if (vLo == null || vHi == null || !Number.isFinite(vLo) || !Number.isFinite(vHi)) {
        return null;
      }
      const span = times[hi] - times[lo];
      const frac = span > 0 ? (tS - times[lo]) / span : 0;
      return { value: vLo + frac * (vHi - vLo), time: tS };
    }

    function drawWaves() {
      const w = waveCanvas.clientWidth;
      const h = waveCanvas.clientHeight;
      const lanes = laneCount();
      waveCtx.fillStyle = "#1e1e1e";
      waveCtx.fillRect(0, 0, w, h);

      const step = pickGridStep();
      const t0 = Math.ceil(state.viewStartS / step) * step;
      waveCtx.strokeStyle = "#3a3a3a";
      waveCtx.lineWidth = 1;
      for (let t = t0; t <= state.viewStartS + state.viewDurationS + 1e-9; t += step) {
        const x = Math.round(timeToX(t, w)) + 0.5;
        waveCtx.beginPath();
        waveCtx.moveTo(x, 0);
        waveCtx.lineTo(x, h);
        waveCtx.stroke();
      }

      for (let i = 0; i < lanes; i++) {
        const y = i * LANE_H;
        waveCtx.fillStyle = i % 2 === 0 ? "#2d2d30" : "#333337";
        waveCtx.fillRect(0, y, w, LANE_H);
        waveCtx.strokeStyle = "#2f2f2f";
        waveCtx.beginPath();
        waveCtx.moveTo(0, y + LANE_H);
        waveCtx.lineTo(w, y + LANE_H);
        waveCtx.stroke();
      }

      state.signals.forEach((signal, idx) => drawSignalLane(waveCtx, idx, signal, w));

      drawGaitMarkers(waveCtx, w, laneCount() * LANE_H);

      if (state.cursorS != null) {
        const cx = timeToX(state.cursorS, w);
        const laneH = laneCount() * LANE_H;
        waveCtx.strokeStyle = "#f44747";
        waveCtx.lineWidth = 1;
        waveCtx.beginPath();
        waveCtx.moveTo(cx + 0.5, 0);
        waveCtx.lineTo(cx + 0.5, laneH);
        waveCtx.stroke();
      }
    }

    function drawAll() {
      drawRuler();
      drawWaves();
      updateCursorOverlay();
      updateScrollUi();
      updateReadouts();
    }

    function updateCursorOverlay() {
      const line = $("cursor-line");
      if (state.cursorS == null) {
        line.style.display = "none";
        return;
      }
      const w = waveCanvas.clientWidth;
      const x = timeToX(state.cursorS, w);
      line.style.display = "block";
      line.style.left = `${x}px`;
    }

    function updateScrollUi() {
      const scroll = $("time-scroll");
      const maxStart = Math.max(0, state.durationS - state.viewDurationS);
      scroll.max = String(Math.max(0, Math.round(maxStart * 1000)));
      scroll.step = String(Math.max(1, Math.round(state.viewDurationS * 10)));
      scroll.value = String(Math.round(state.viewStartS * 1000));
      $("scroll-label-start").textContent = fmtTimeS(0);
      $("scroll-label-end").textContent = fmtTimeS(state.durationS);

      const mini = $("minimap");
      const vp = $("minimap-viewport");
      const frac = state.durationS > 0 ? state.viewDurationS / state.durationS : 1;
      const startFrac = state.durationS > 0 ? state.viewStartS / state.durationS : 0;
      const mw = mini.clientWidth;
      vp.style.width = `${Math.max(4, frac * mw)}px`;
      vp.style.left = `${startFrac * (mw - vp.offsetWidth)}px`;
    }

    function updateReadouts() {
      const winEnd = state.viewStartS + state.viewDurationS;
      $("cursor-readout").innerHTML = `
        <div><strong>Cursor</strong> ${state.cursorS != null ? fmtTimeS(state.cursorS) : "—"}</div>
        <div><strong>Window</strong> ${fmtTimeS(state.viewStartS)} – ${fmtTimeS(winEnd)}</div>
        <div><strong>Span</strong> ${fmtTimeS(state.viewDurationS)}</div>
      `;

      function fmtSignalValue(signal, value) {
        if (value == null || !Number.isFinite(value)) return "—";
        if (signal.unit === "m") return `${(value * 100).toFixed(2)} cm`;
        if (signal.unit === "deg") return `${value.toFixed(2)}°`;
        if (signal.unit === "deg/s") return `${value.toFixed(2)}°/s`;
        if (signal.unit === "px") return `${value.toFixed(1)} px`;
        return String(value);
      }

      if (state.signalLoadError) {
        $("signal-readout").innerHTML = `<div style="color:#f44747">${state.signalLoadError}</div>`;
      } else if (state.signals.length) {
        let html = state.signals.map((s) => {
          const n = s.stride_index ? `${s.times_s.length} strides` : `${s.times_s.length.toLocaleString()} samples`;
          const meanNote = s.signal_mean != null
            ? (s.unit === "deg"
              ? ` · mean ${s.signal_mean.toFixed(2)}°`
              : ` · mean ${s.signal_mean.toFixed(1)} px`)
            : "";
          return `<div><strong>${s.label}</strong> (${s.unit}) · ${n}${meanNote}</div>`;
        }).join("");
        if (state.waveMissing?.length) {
          html += `<div class="muted" style="margin-top:0.35rem">Missing: ${state.waveMissing.join(", ")}</div>`;
        }
        if (state.cursorS != null) {
          html += `<div style="margin-top:0.35rem"><strong>At cursor</strong></div>`;
          for (const s of state.signals) {
            const hit = interpolateAtTime(s, state.cursorS);
            html += `<div>${s.label}: ${fmtSignalValue(s, hit?.value)}</div>`;
          }
        }
        $("signal-readout").innerHTML = html;
      } else {
        $("signal-readout").textContent = "No signals loaded";
      }

      $("status-left").textContent = `UTC ns ${fmtUtcNs(state.tStartNs)} … ${fmtUtcNs(state.tEndNs)}`;
      $("status-right").textContent = `${state.fsHz} Hz · ${state.nGrid.toLocaleString()} samples · ${fmtTimeS(state.durationS)} total`;

      if (state.markers.length) {
        const rows = [
          ["lf_IC", "LF IC"],
          ["lf_TO", "LF TO"],
          ["rf_IC", "RF IC"],
          ["rf_TO", "RF TO"],
        ];
        $("marker-legend").innerHTML = rows.map(([key, label]) => {
          const style = MARKER_STYLES[key];
          const dash = style.dash.length ? " dashed" : "";
          return `<div><span class="swatch${dash}" style="--swatch-color:${style.color}"></span>${label}</div>`;
        }).join("") + `<div style="margin-top:0.35rem">${state.markers.length.toLocaleString()} events</div>`;
      } else {
        $("marker-legend").textContent = "No gait events (run gait analysis)";
      }
    }

    function setYScaleManual(signal, ymin, ymax) {
      const ys = ensureYScale(signal.id);
      ys.auto = false;
      ys.ymin = fmtScaleValue(ymin, signal.unit);
      ys.ymax = fmtScaleValue(ymax, signal.unit);
    }

    function buildYScalePanel() {
      const container = $("y-scale-rows");
      container.replaceChildren();
      const t0 = state.viewStartS;
      const t1 = state.viewStartS + state.viewDurationS;

      for (const signal of state.signals) {
        const ys = ensureYScale(signal.id);
        const autoRange = valueRangeInWindow(signal.times_s, signal.values, t0, t1);
        const unitHint = signal.unit === "m" ? "cm" : (signal.unit || "");

        const row = document.createElement("div");
        row.className = "y-scale-row";

        const label = document.createElement("div");
        label.className = "y-scale-label";
        label.textContent = signal.label;
        label.title = signal.label;

        const autoRow = document.createElement("label");
        autoRow.className = "y-scale-auto";
        const autoCb = document.createElement("input");
        autoCb.type = "checkbox";
        autoCb.checked = ys.auto;
        autoRow.append(autoCb, document.createTextNode(" Auto (visible window)"));

        const inputs = document.createElement("div");
        inputs.className = "y-scale-inputs";
        const yminInput = document.createElement("input");
        yminInput.type = "number";
        yminInput.step = "any";
        yminInput.placeholder = `min ${scaleInputPlaceholder(autoRange.vmin, signal.unit)}`;
        yminInput.value = ys.auto ? "" : ys.ymin;
        yminInput.disabled = ys.auto;
        yminInput.title = unitHint ? `min (${unitHint})` : "min";

        const ymaxInput = document.createElement("input");
        ymaxInput.type = "number";
        ymaxInput.step = "any";
        ymaxInput.placeholder = `max ${scaleInputPlaceholder(autoRange.vmax, signal.unit)}`;
        ymaxInput.value = ys.auto ? "" : ys.ymax;
        ymaxInput.disabled = ys.auto;
        ymaxInput.title = unitHint ? `max (${unitHint})` : "max";

        inputs.append(yminInput, ymaxInput);

        const fitBtn = document.createElement("button");
        fitBtn.type = "button";
        fitBtn.className = "y-scale-fit";
        fitBtn.textContent = "Fit full data";

        const applyManual = () => {
          const ymin = parseScaleInput(yminInput.value, signal.unit);
          const ymax = parseScaleInput(ymaxInput.value, signal.unit);
          if (ymin == null || ymax == null) return;
          ys.auto = false;
          ys.ymin = yminInput.value;
          ys.ymax = ymaxInput.value;
          autoCb.checked = false;
          yminInput.disabled = false;
          ymaxInput.disabled = false;
          drawAll();
        };

        autoCb.addEventListener("change", () => {
          ys.auto = autoCb.checked;
          yminInput.disabled = ys.auto;
          ymaxInput.disabled = ys.auto;
          if (ys.auto) {
            yminInput.value = "";
            ymaxInput.value = "";
          }
          drawAll();
        });

        for (const input of [yminInput, ymaxInput]) {
          input.addEventListener("change", applyManual);
          input.addEventListener("keydown", (e) => {
            if (e.key === "Enter") applyManual();
          });
        }

        fitBtn.addEventListener("click", () => {
          const full = valueRangeFullData(signal.times_s, signal.values);
          setYScaleManual(signal, full.vmin, full.vmax);
          autoCb.checked = false;
          ys.auto = false;
          yminInput.disabled = false;
          ymaxInput.disabled = false;
          yminInput.value = ys.ymin;
          ymaxInput.value = ys.ymax;
          drawAll();
        });

        row.append(label, autoRow, inputs, fitBtn);
        container.appendChild(row);
      }
    }

    function buildNameRows() {
      const container = $("name-rows");
      container.replaceChildren();
      const lanes = laneCount();
      for (let i = 0; i < lanes; i++) {
        const row = document.createElement("div");
        row.className = "name-row" + (i < state.signals.length ? " active" : "");
        if (i < state.signals.length) {
          row.textContent = state.signals[i].label;
        } else {
          row.textContent = `— empty lane ${i - state.signals.length + 1} —`;
        }
        container.appendChild(row);
      }
    }

    async function loadSession() {
      if (!sessionId) throw new Error("Missing session id in URL");
      $("back-link").href = `/?session=${encodeURIComponent(sessionId)}`;

      const res = await fetch(`/api/sessions/${encodeURIComponent(sessionId)}`);
      if (!res.ok) throw new Error(`Session not found (${res.status})`);
      const data = await res.json();
      const gm = data.grid_meta || {};
      if (!gm.t_start_utc_ns || !gm.duration_s) {
        throw new Error("Session has no grid_200hz_meta timeline");
      }

      state.tStartNs = Number(gm.t_start_utc_ns);
      state.tEndNs = Number(gm.t_end_utc_ns || state.tStartNs);
      state.durationS = Number(gm.duration_s);
      state.fsHz = Number(gm.fs_hz || 200);
      state.nGrid = Number(gm.n_grid || 0);
      state.viewDurationS = Math.min(30, state.durationS);
      state.viewStartS = 0;
      clampView();

      $("header-meta").textContent =
        `${sessionId} · ${data.run_label || "—"} · ${fmtTimeS(state.durationS)}`;

      const sigRes = await fetch(
        `/api/sessions/${encodeURIComponent(sessionId)}/waves`,
      );
      if (sigRes.ok) {
        const bundle = await sigRes.json();
        state.signals = bundle.signals || [];
        state.markers = bundle.markers || [];
        state.waveMissing = bundle.missing || [];
        state.signalLoadError = null;
      } else {
        state.signals = [];
        state.markers = [];
        state.waveMissing = [];
        const hint = sigRes.status === 404
          ? "Restart the viewer (<code>uv run python serve_gait_xsens.py</code>) — an old server may still be running."
          : "Run gait analysis and 01_clean step 5 for this session.";
        state.signalLoadError = `Wave signals failed (HTTP ${sigRes.status}). ${hint}`;
      }

      buildNameRows();
      buildYScalePanel();
      resizeCanvases();
    }

    $("btn-y-auto-all").addEventListener("click", () => {
      for (const signal of state.signals) {
        const ys = ensureYScale(signal.id);
        ys.auto = true;
        ys.ymin = "";
        ys.ymax = "";
      }
      buildYScalePanel();
      drawAll();
    });

    $("time-scroll").addEventListener("input", (e) => {
      state.viewStartS = Number(e.target.value) / 1000;
      clampView();
      drawAll();
    });

    $("btn-zoom-in").addEventListener("click", () => {
      const center = state.viewStartS + state.viewDurationS / 2;
      state.viewDurationS *= 0.5;
      state.viewStartS = center - state.viewDurationS / 2;
      clampView();
      drawAll();
    });

    $("btn-zoom-out").addEventListener("click", () => {
      const center = state.viewStartS + state.viewDurationS / 2;
      state.viewDurationS *= 2;
      state.viewStartS = center - state.viewDurationS / 2;
      clampView();
      drawAll();
    });

    $("btn-fit").addEventListener("click", () => {
      state.viewStartS = 0;
      state.viewDurationS = state.durationS;
      clampView();
      drawAll();
    });

    $("btn-cursor").addEventListener("click", () => {
      state.cursorMode = !state.cursorMode;
      $("btn-cursor").classList.toggle("active", state.cursorMode);
    });

    $("canvas-wrap").addEventListener("click", (e) => {
      if (!state.cursorMode) return;
      const rect = waveCanvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      state.cursorS = xToTime(x, rect.width);
      drawAll();
    });

    window.addEventListener("resize", resizeCanvases);

    loadSession().catch((err) => {
      $("header-meta").textContent = err.message;
      document.body.style.color = "#f44747";
    });
  </script>
</body>
</html>
