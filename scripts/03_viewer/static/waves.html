<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wave viewer — gazeGait</title>
  <style>
    :root {
      --bg: #1e1e1e;
      --panel: #252526;
      --lane-a: #2d2d30;
      --lane-b: #333337;
      --border: #3f3f46;
      --grid: #454545;
      --text: #d4d4d4;
      --muted: #9a9a9a;
      --accent: #4ec9b0;
      --cursor: #f44747;
      --ruler: #569cd6;
      --tools-w: 200px;
      --names-w: 180px;
      --lane-h: 28px;
      --bottom-h: 88px;
      --header-h: 44px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: Consolas, "Cascadia Mono", "Segoe UI", monospace;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }
    .app {
      display: grid;
      grid-template-rows: var(--header-h) 1fr var(--bottom-h);
      height: 100vh;
    }
    header {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0 0.75rem;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      font-size: 0.85rem;
    }
    header h1 { margin: 0; font-size: 0.95rem; font-weight: 600; }
    header .meta { color: var(--muted); }
    a.btn {
      color: var(--text);
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 0.25rem 0.55rem;
      background: #2a2a2a;
      font-size: 0.8rem;
    }
    a.btn:hover { background: #353535; }
    .main {
      display: grid;
      grid-template-columns: var(--names-w) 1fr var(--tools-w);
      min-height: 0;
      overflow: hidden;
    }
    .names {
      background: var(--panel);
      border-right: 1px solid var(--border);
      overflow: hidden;
    }
    .names .head {
      height: 26px;
      border-bottom: 1px solid var(--border);
      padding: 0.35rem 0.5rem;
      font-size: 0.72rem;
      color: var(--muted);
      background: #2a2a2a;
    }
    .name-row {
      height: var(--lane-h);
      line-height: var(--lane-h);
      padding: 0 0.5rem;
      font-size: 0.75rem;
      border-bottom: 1px solid #2f2f2f;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--muted);
    }
    .name-row:nth-child(odd) { background: var(--lane-a); }
    .name-row:nth-child(even) { background: var(--lane-b); }
    .name-row.active { color: var(--accent); }
    .names-scroll { overflow-y: auto; height: calc(100% - 26px); }
    .wave-area {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }
    .ruler-wrap {
      height: 26px;
      background: #2a2a2a;
      border-bottom: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }
    #ruler-canvas { display: block; width: 100%; height: 26px; }
    .canvas-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
      min-height: 0;
    }
    #wave-canvas { display: block; width: 100%; height: 100%; }
    .cursor-line {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      background: var(--cursor);
      pointer-events: none;
      z-index: 2;
      display: none;
    }
    .tools {
      background: var(--panel);
      border-left: 1px solid var(--border);
      padding: 0.5rem;
      overflow-y: auto;
      font-size: 0.78rem;
    }
    .tools h2 {
      margin: 0 0 0.5rem;
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .tools section { margin-bottom: 1rem; }
    .tools button {
      display: block;
      width: 100%;
      margin-bottom: 0.35rem;
      padding: 0.35rem 0.5rem;
      font: inherit;
      font-size: 0.78rem;
      background: #2a2a2a;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 3px;
      cursor: pointer;
      text-align: left;
    }
    .tools button:hover { background: #353535; }
    .tools button.active { border-color: var(--accent); color: var(--accent); }
    .tools .readout {
      margin-top: 0.35rem;
      padding: 0.35rem;
      background: #1a1a1a;
      border: 1px solid var(--border);
      border-radius: 3px;
      font-size: 0.72rem;
      line-height: 1.5;
      color: var(--muted);
    }
    .tools .readout strong { color: var(--text); }
    .bottom {
      background: var(--panel);
      border-top: 1px solid var(--border);
      padding: 0.45rem 0.75rem 0.55rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .scroll-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.72rem;
      color: var(--muted);
    }
    .scroll-row input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
    }
    .minimap {
      position: relative;
      height: 18px;
      background: #1a1a1a;
      border: 1px solid var(--border);
      border-radius: 2px;
    }
    .minimap-viewport {
      position: absolute;
      top: 1px;
      bottom: 1px;
      background: rgba(78, 201, 176, 0.25);
      border: 1px solid var(--accent);
      border-radius: 1px;
      min-width: 4px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <a class="btn" id="back-link" href="/">← Session</a>
      <h1>Wave viewer</h1>
      <span class="meta" id="header-meta">Loading…</span>
    </header>

    <div class="main">
      <div class="names" id="names-panel">
        <div class="head">Name</div>
        <div class="names-scroll" id="name-rows"></div>
      </div>

      <div class="wave-area">
        <div class="ruler-wrap">
          <canvas id="ruler-canvas"></canvas>
        </div>
        <div class="canvas-wrap" id="canvas-wrap">
          <canvas id="wave-canvas"></canvas>
          <div class="cursor-line" id="cursor-line"></div>
        </div>
      </div>

      <aside class="tools">
        <section>
          <h2>View</h2>
          <button type="button" id="btn-zoom-in">Zoom in</button>
          <button type="button" id="btn-zoom-out">Zoom out</button>
          <button type="button" id="btn-fit">Fit full timeline</button>
        </section>
        <section>
          <h2>Cursor</h2>
          <button type="button" id="btn-cursor" class="active">Time cursor</button>
          <div class="readout" id="cursor-readout">
            <div><strong>Cursor</strong> —</div>
            <div><strong>Window</strong> —</div>
          </div>
        </section>
        <section>
          <h2>Signals</h2>
          <div class="readout" id="signal-readout">Loading…</div>
        </section>
      </aside>
    </div>

    <div class="bottom">
      <div class="scroll-row">
        <span id="scroll-label-start">0 s</span>
        <input type="range" id="time-scroll" min="0" max="1000" value="0" step="1">
        <span id="scroll-label-end">—</span>
      </div>
      <div class="minimap" id="minimap">
        <div class="minimap-viewport" id="minimap-viewport"></div>
      </div>
      <div class="status-row">
        <span id="status-left">t_start —</span>
        <span id="status-right">Sample rate —</span>
      </div>
    </div>
  </div>

  <script>
    const LANE_H = 28;
    const EMPTY_LANES = 8;
    const SIGNAL_COLORS = {
      lf_position_z: "#4ec9b0",
    };

    const sessionId = (() => {
      const parts = window.location.pathname.split("/").filter(Boolean);
      return parts[0] === "session" ? parts[1] : null;
    })();

    const state = {
      tStartNs: 0,
      tEndNs: 0,
      durationS: 0,
      fsHz: 200,
      nGrid: 0,
      viewStartS: 0,
      viewDurationS: 30,
      cursorS: null,
      cursorMode: true,
      signals: [],
      signalLoadError: null,
    };

    const $ = (id) => document.getElementById(id);
    const waveCanvas = $("wave-canvas");
    const rulerCanvas = $("ruler-canvas");
    const waveCtx = waveCanvas.getContext("2d");
    const rulerCtx = rulerCanvas.getContext("2d");

    function fmtTimeS(s) {
      if (s == null || !Number.isFinite(s)) return "—";
      if (s >= 60) {
        const m = Math.floor(s / 60);
        const r = s - m * 60;
        return `${m}:${r.toFixed(2).padStart(5, "0")}`;
      }
      return `${s.toFixed(3)} s`;
    }

    function fmtUtcNs(ns) {
      return `${ns}`;
    }

    function clampView() {
      const minDur = Math.min(1, state.durationS || 1);
      state.viewDurationS = Math.max(minDur, Math.min(state.durationS || minDur, state.viewDurationS));
      const maxStart = Math.max(0, state.durationS - state.viewDurationS);
      state.viewStartS = Math.max(0, Math.min(maxStart, state.viewStartS));
      if (state.cursorS != null) {
        state.cursorS = Math.max(state.viewStartS, Math.min(state.viewStartS + state.viewDurationS, state.cursorS));
      }
    }

    function resizeCanvases() {
      const wrap = $("canvas-wrap");
      const dpr = window.devicePixelRatio || 1;
      const w = wrap.clientWidth;
      const h = wrap.clientHeight;
      waveCanvas.width = Math.max(1, Math.floor(w * dpr));
      waveCanvas.height = Math.max(1, Math.floor(h * dpr));
      waveCanvas.style.width = `${w}px`;
      waveCanvas.style.height = `${h}px`;
      waveCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const rw = wrap.clientWidth;
      rulerCanvas.width = Math.max(1, Math.floor(rw * dpr));
      rulerCanvas.height = Math.floor(26 * dpr);
      rulerCanvas.style.width = `${rw}px`;
      rulerCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

      drawAll();
    }

    function timeToX(tS, width) {
      const rel = (tS - state.viewStartS) / state.viewDurationS;
      return rel * width;
    }

    function xToTime(x, width) {
      return state.viewStartS + (x / width) * state.viewDurationS;
    }

    function pickGridStep() {
      const targetPx = 80;
      const w = waveCanvas.clientWidth || 800;
      const secPerPx = state.viewDurationS / w;
      const raw = secPerPx * targetPx;
      const steps = [0.1, 0.2, 0.5, 1, 2, 5, 10, 20, 30, 60];
      return steps.find((s) => s >= raw) || 60;
    }

    function drawRuler() {
      const w = rulerCanvas.clientWidth;
      const h = 26;
      rulerCtx.fillStyle = "#2a2a2a";
      rulerCtx.fillRect(0, 0, w, h);
      const step = pickGridStep();
      const t0 = Math.ceil(state.viewStartS / step) * step;
      rulerCtx.fillStyle = "#9a9a9a";
      rulerCtx.font = "11px Consolas, monospace";
      rulerCtx.strokeStyle = "#569cd6";
      rulerCtx.lineWidth = 1;
      for (let t = t0; t <= state.viewStartS + state.viewDurationS + 1e-9; t += step) {
        const x = Math.round(timeToX(t, w)) + 0.5;
        rulerCtx.beginPath();
        rulerCtx.moveTo(x, 18);
        rulerCtx.lineTo(x, h);
        rulerCtx.stroke();
        rulerCtx.fillText(fmtTimeS(t), x + 3, 12);
      }
    }

    function laneCount() {
      return Math.max(state.signals.length + EMPTY_LANES, EMPTY_LANES);
    }

    function valueRangeInWindow(times, values, t0, t1) {
      let vmin = Infinity;
      let vmax = -Infinity;
      for (let i = 0; i < times.length; i++) {
        const t = times[i];
        const tNext = i + 1 < times.length ? times[i + 1] : t1;
        if (tNext < t0 || t > t1) continue;
        vmin = Math.min(vmin, values[i]);
        vmax = Math.max(vmax, values[i]);
      }
      if (!Number.isFinite(vmin)) return { vmin: 0, vmax: 1 };
      if (vmin === vmax) {
        const pad = Math.max(Math.abs(vmin) * 0.1, 0.01);
        return { vmin: vmin - pad, vmax: vmax + pad };
      }
      const pad = (vmax - vmin) * 0.08;
      return { vmin: vmin - pad, vmax: vmax + pad };
    }

    function valueToLaneY(laneIdx, value, vmin, vmax) {
      const top = laneIdx * LANE_H + 3;
      const bottom = (laneIdx + 1) * LANE_H - 3;
      const frac = (value - vmin) / (vmax - vmin);
      return bottom - frac * (bottom - top);
    }

    function lowerBound(times, t) {
      let lo = 0;
      let hi = times.length;
      while (lo < hi) {
        const mid = (lo + hi) >> 1;
        if (times[mid] < t) lo = mid + 1;
        else hi = mid;
      }
      return lo;
    }

    function sliceWindow(times, values, t0, t1) {
      const i0 = Math.max(0, lowerBound(times, t0) - 1);
      const i1 = Math.min(times.length, lowerBound(times, t1) + 1);
      return { times: times.slice(i0, i1), values: values.slice(i0, i1) };
    }

    function decimate(times, values, maxPoints) {
      if (times.length <= maxPoints) return { times, values };
      const outT = [];
      const outV = [];
      const n = times.length;
      for (let j = 0; j < maxPoints; j++) {
        const i = Math.min(n - 1, Math.floor((j * (n - 1)) / (maxPoints - 1)));
        outT.push(times[i]);
        outV.push(values[i]);
      }
      return { times: outT, values: outV };
    }

    function drawSignalLane(ctx, laneIdx, signal, w) {
      const times = signal.times_s;
      const values = signal.values;
      if (!times?.length) return;

      const t0 = state.viewStartS;
      const t1 = state.viewStartS + state.viewDurationS;
      const { vmin, vmax } = valueRangeInWindow(times, values, t0, t1);
      const color = SIGNAL_COLORS[signal.id] || "#dcdcaa";
      const yBase = laneIdx * LANE_H;
      const isStrideSeries = Array.isArray(signal.stride_index);

      let plot = sliceWindow(times, values, t0, t1);
      if (!isStrideSeries) {
        plot = decimate(plot.times, plot.values, Math.max(64, w * 2));
      }

      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = isStrideSeries ? 1.5 : 1.25;

      ctx.beginPath();
      let started = false;
      for (let i = 0; i < plot.times.length; i++) {
        const x = timeToX(plot.times[i], w);
        const y = valueToLaneY(laneIdx, plot.values[i], vmin, vmax);
        if (!started) {
          ctx.moveTo(x, y);
          started = true;
        } else {
          ctx.lineTo(x, y);
        }
      }
      if (started) ctx.stroke();

      if (isStrideSeries) {
        for (let i = 0; i < times.length; i++) {
          const t = times[i];
          if (t < t0 - 0.5 || t > t1 + 0.5) continue;
          const x = timeToX(t, w);
          const y = valueToLaneY(laneIdx, values[i], vmin, vmax);
          const outlier = signal.is_outlier && signal.is_outlier[i];
          ctx.beginPath();
          ctx.fillStyle = outlier ? "#ce9178" : color;
          ctx.arc(x, y, outlier ? 2.5 : 2, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      ctx.fillStyle = "#6a9955";
      ctx.font = "10px Consolas, monospace";
      ctx.fillText(`${vmin.toFixed(3)}–${vmax.toFixed(3)} ${signal.unit || ""}`, 4, yBase + 11);
    }

    function interpolateAtTime(signal, tS) {
      const times = signal.times_s;
      const values = signal.values;
      if (!times?.length) return null;
      if (tS <= times[0]) return { value: values[0], time: tS };
      if (tS >= times[times.length - 1]) return { value: values[values.length - 1], time: tS };
      let lo = 0;
      let hi = times.length - 1;
      while (lo + 1 < hi) {
        const mid = (lo + hi) >> 1;
        if (times[mid] <= tS) lo = mid;
        else hi = mid;
      }
      const span = times[hi] - times[lo];
      const frac = span > 0 ? (tS - times[lo]) / span : 0;
      return { value: values[lo] + frac * (values[hi] - values[lo]), time: tS };
    }

    function drawWaves() {
      const w = waveCanvas.clientWidth;
      const h = waveCanvas.clientHeight;
      const lanes = laneCount();
      waveCtx.fillStyle = "#1e1e1e";
      waveCtx.fillRect(0, 0, w, h);

      const step = pickGridStep();
      const t0 = Math.ceil(state.viewStartS / step) * step;
      waveCtx.strokeStyle = "#3a3a3a";
      waveCtx.lineWidth = 1;
      for (let t = t0; t <= state.viewStartS + state.viewDurationS + 1e-9; t += step) {
        const x = Math.round(timeToX(t, w)) + 0.5;
        waveCtx.beginPath();
        waveCtx.moveTo(x, 0);
        waveCtx.lineTo(x, h);
        waveCtx.stroke();
      }

      for (let i = 0; i < lanes; i++) {
        const y = i * LANE_H;
        waveCtx.fillStyle = i % 2 === 0 ? "#2d2d30" : "#333337";
        waveCtx.fillRect(0, y, w, LANE_H);
        waveCtx.strokeStyle = "#2f2f2f";
        waveCtx.beginPath();
        waveCtx.moveTo(0, y + LANE_H);
        waveCtx.lineTo(w, y + LANE_H);
        waveCtx.stroke();
      }

      state.signals.forEach((signal, idx) => drawSignalLane(waveCtx, idx, signal, w));

      if (state.cursorS != null) {
        const cx = timeToX(state.cursorS, w);
        waveCtx.strokeStyle = "#f44747";
        waveCtx.lineWidth = 1;
        waveCtx.beginPath();
        waveCtx.moveTo(cx + 0.5, 0);
        waveCtx.lineTo(cx + 0.5, h);
        waveCtx.stroke();
      }
    }

    function drawAll() {
      drawRuler();
      drawWaves();
      updateCursorOverlay();
      updateScrollUi();
      updateReadouts();
    }

    function updateCursorOverlay() {
      const line = $("cursor-line");
      if (state.cursorS == null) {
        line.style.display = "none";
        return;
      }
      const w = waveCanvas.clientWidth;
      const x = timeToX(state.cursorS, w);
      line.style.display = "block";
      line.style.left = `${x}px`;
    }

    function updateScrollUi() {
      const scroll = $("time-scroll");
      const maxStart = Math.max(0, state.durationS - state.viewDurationS);
      scroll.max = String(Math.max(0, Math.round(maxStart * 1000)));
      scroll.step = String(Math.max(1, Math.round(state.viewDurationS * 10)));
      scroll.value = String(Math.round(state.viewStartS * 1000));
      $("scroll-label-start").textContent = fmtTimeS(0);
      $("scroll-label-end").textContent = fmtTimeS(state.durationS);

      const mini = $("minimap");
      const vp = $("minimap-viewport");
      const frac = state.durationS > 0 ? state.viewDurationS / state.durationS : 1;
      const startFrac = state.durationS > 0 ? state.viewStartS / state.durationS : 0;
      const mw = mini.clientWidth;
      vp.style.width = `${Math.max(4, frac * mw)}px`;
      vp.style.left = `${startFrac * (mw - vp.offsetWidth)}px`;
    }

    function updateReadouts() {
      const winEnd = state.viewStartS + state.viewDurationS;
      $("cursor-readout").innerHTML = `
        <div><strong>Cursor</strong> ${state.cursorS != null ? fmtTimeS(state.cursorS) : "—"}</div>
        <div><strong>Window</strong> ${fmtTimeS(state.viewStartS)} – ${fmtTimeS(winEnd)}</div>
        <div><strong>Span</strong> ${fmtTimeS(state.viewDurationS)}</div>
      `;

      const lf = state.signals.find((s) => s.id === "lf_position_z");
      let signalText = "—";
      if (lf && state.cursorS != null) {
        const hit = interpolateAtTime(lf, state.cursorS);
        if (hit) {
          signalText = `${(hit.value * 100).toFixed(2)} cm`;
        }
      }
      if (state.signalLoadError) {
        $("signal-readout").innerHTML = `<div style="color:#f44747">${state.signalLoadError}</div>`;
      } else if (state.signals.length) {
        $("signal-readout").innerHTML = state.signals.map((s) => {
            const n = s.stride_index ? `${s.times_s.length} strides` : `${s.times_s.length.toLocaleString()} samples`;
            return `<div><strong>${s.label}</strong> (${s.unit}) · ${n}</div>`;
          }).join("")
          + (state.cursorS != null ? `<div style="margin-top:0.35rem"><strong>At cursor</strong> ${signalText}</div>` : "");
      } else {
        $("signal-readout").textContent = "No signals loaded";
      }

      $("status-left").textContent = `UTC ns ${fmtUtcNs(state.tStartNs)} … ${fmtUtcNs(state.tEndNs)}`;
      $("status-right").textContent = `${state.fsHz} Hz · ${state.nGrid.toLocaleString()} samples · ${fmtTimeS(state.durationS)} total`;
    }

    function buildNameRows() {
      const container = $("name-rows");
      container.replaceChildren();
      const lanes = laneCount();
      for (let i = 0; i < lanes; i++) {
        const row = document.createElement("div");
        row.className = "name-row" + (i < state.signals.length ? " active" : "");
        if (i < state.signals.length) {
          row.textContent = state.signals[i].label;
        } else {
          row.textContent = `— empty lane ${i - state.signals.length + 1} —`;
        }
        container.appendChild(row);
      }
    }

    async function loadSession() {
      if (!sessionId) throw new Error("Missing session id in URL");
      $("back-link").href = `/?session=${encodeURIComponent(sessionId)}`;

      const res = await fetch(`/api/sessions/${encodeURIComponent(sessionId)}`);
      if (!res.ok) throw new Error(`Session not found (${res.status})`);
      const data = await res.json();
      const gm = data.grid_meta || {};
      if (!gm.t_start_utc_ns || !gm.duration_s) {
        throw new Error("Session has no grid_200hz_meta timeline");
      }

      state.tStartNs = Number(gm.t_start_utc_ns);
      state.tEndNs = Number(gm.t_end_utc_ns || state.tStartNs);
      state.durationS = Number(gm.duration_s);
      state.fsHz = Number(gm.fs_hz || 200);
      state.nGrid = Number(gm.n_grid || 0);
      state.viewDurationS = Math.min(30, state.durationS);
      state.viewStartS = 0;
      clampView();

      $("header-meta").textContent =
        `${sessionId} · ${data.run_label || "—"} · ${fmtTimeS(state.durationS)}`;

      const sigRes = await fetch(
        `/api/sessions/${encodeURIComponent(sessionId)}/waves/lf_position_z`,
      );
      if (sigRes.ok) {
        state.signals = [await sigRes.json()];
        state.signalLoadError = null;
      } else {
        state.signals = [];
        const hint = sigRes.status === 404
          ? "Restart the viewer (<code>uv run python serve_gait_xsens.py</code>) — an old server may still be running."
          : "Run gait analysis for this session first.";
        state.signalLoadError = `LF position_z failed (HTTP ${sigRes.status}). ${hint}`;
      }

      buildNameRows();
      resizeCanvases();
    }

    $("time-scroll").addEventListener("input", (e) => {
      state.viewStartS = Number(e.target.value) / 1000;
      clampView();
      drawAll();
    });

    $("btn-zoom-in").addEventListener("click", () => {
      const center = state.viewStartS + state.viewDurationS / 2;
      state.viewDurationS *= 0.5;
      state.viewStartS = center - state.viewDurationS / 2;
      clampView();
      drawAll();
    });

    $("btn-zoom-out").addEventListener("click", () => {
      const center = state.viewStartS + state.viewDurationS / 2;
      state.viewDurationS *= 2;
      state.viewStartS = center - state.viewDurationS / 2;
      clampView();
      drawAll();
    });

    $("btn-fit").addEventListener("click", () => {
      state.viewStartS = 0;
      state.viewDurationS = state.durationS;
      clampView();
      drawAll();
    });

    $("btn-cursor").addEventListener("click", () => {
      state.cursorMode = !state.cursorMode;
      $("btn-cursor").classList.toggle("active", state.cursorMode);
    });

    $("canvas-wrap").addEventListener("click", (e) => {
      if (!state.cursorMode) return;
      const rect = waveCanvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      state.cursorS = xToTime(x, rect.width);
      drawAll();
    });

    window.addEventListener("resize", resizeCanvases);

    loadSession().catch((err) => {
      $("header-meta").textContent = err.message;
      document.body.style.color = "#f44747";
    });
  </script>
</body>
</html>
