[project]
name = "gazegait"
version = "0.1.0"
description = "Eye / head / foot multimodal pipeline for the URP2026 recording stack. Bridges into lin2025_IMU-gait_analysis for ZUPT-based gait analysis."
readme = "README.md"
requires-python = ">=3.9,<3.11"
license = { text = "MIT" }
authors = [{ name = "Thom" }]

dependencies = [
    "numpy>=1.21,<2",
    "scipy>=1.7",
    "pandas>=1.3",
    "matplotlib>=3.4",
    "pyarrow>=10",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gazegait"]

# After the lin2025 fork is created and added as a submodule under
# analysis/external/imu_gait_analysis, install it as editable with:
#   uv pip install -e external/imu_gait_analysis
# (kept as a manual step rather than a path-dep so that fresh clones without
# the submodule still resolve.)

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
