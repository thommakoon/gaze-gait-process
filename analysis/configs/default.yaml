# =============================================================================
# gazegait default pipeline configuration.
# Every magic number lives here, not in code. The full file is hashed and
# recorded into each session manifest for reproducibility.
# =============================================================================

# ---- Filtering --------------------------------------------------------------
# All low-pass filtering is done with scipy.signal.filtfilt (zero phase).
# DO NOT introduce causal lfilter anywhere -- it would break cross-modal
# alignment by ~10-20 ms (group delay).
filters:
  foot_accel_lp_hz: 20.0         # for ZUPT integration + orientation
  foot_event_bp_hz: [5.0, 30.0]  # parallel band-pass for heel-strike detection
  head_lp_hz: 10.0               # head IMU smoothing for feature derivation
  butter_order: 2                # effective order doubles with filtfilt

# ---- ZUPT / stance detection ------------------------------------------------
# Multi-condition SHOE-style detector. All conditions must hold for at least
# `min_stance_window_ms` continuously for a sample to be flagged as stance.
zupt:
  gyro_mag_thresh_dps: 50.0
  accel_residual_thresh_mps2: 0.5   # ||a|| relative to 9.81
  accel_var_window_ms: 50
  accel_var_thresh_mps2: 0.05
  min_stance_window_ms: 80

# ---- Gait sanity bounds -----------------------------------------------------
gait:
  min_stride_s: 0.4
  max_stride_s: 2.0
  min_stance_pct: 30.0
  max_stance_pct: 80.0

# ---- Eye / gaze -------------------------------------------------------------
gaze:
  use_head_compensation: true       # always rotate to world frame before
                                    # fixation / saccade detection.
  saccade_velocity_thresh_dps: 30.0
  fixation_min_duration_ms: 80

# ---- Fusion -----------------------------------------------------------------
fusion:
  event_window_pre_ms: 200          # window head/eye around heel-strike
  event_window_post_ms: 500
  coherence_fs_hz: 100.0            # only DERIVED features are resampled,
                                    # never raw IMU.
  coherence_max_lag_s: 2.0

# ---- Session timeline -------------------------------------------------------
session:
  clip_to_common_overlap: true      # clip every stream to [max(t0), min(t1)]
  treat_disconnects_as_missing: true
